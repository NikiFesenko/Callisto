version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: colisto_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: colisto_db
      MYSQL_USER: colisto
      MYSQL_PASSWORD: colisto_dev
    ports:
      - "3306:3306"
    volumes:
      - colisto_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "colisto", "-pcolisto_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: colisto_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - colisto_redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  colisto_mysql_data:
    driver: local
  colisto_redis_data:
    driver: local
